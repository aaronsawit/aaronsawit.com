name: validate
on: [push, pull_request]
jobs:
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sigma-cli pysigma-backend-splunk pysigma-backend-elasticsearch pyyaml
      - name: Syntax and ATT&CK tag validation
        run: sigma check --fail-on-error --fail-on-issues rules/
      - name: Detection logic against fixtures
        run: python tests/run_tests.py
      - name: Rules still convert to Splunk and Elastic
        run: |
          for f in rules/*.yml; do
            sigma convert -t splunk --without-pipeline "$f" > /dev/null
          done
